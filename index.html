<script src="manifest.js"></script>
<!-- Optional cloud progress, BEFORE the hub's own script rather than after it:
     render() reads CLOUD.load for each row's progress badge and runs at parse
     time, so cloud.js has to already exist. cloud-sync.js finds no #codeInput
     here and returns early - the hub has no editor - but it is loaded anyway so
     all four files are one block wherever they appear. Every one is inert until
     cloud-config.js names a project. -->
<script src="cloud-config.js"></script>
<script src="cloud.js"></script>
<script src="cloud-ui.js"></script>
<script src="cloud-sync.js"></script>
<script>
'use strict';
/* The hub renders from PRACTICE_MANIFEST rather than from a hardcoded list, so
   adding a problem cannot leave this page stale. It is one Primer Box of rows -
   a repo file listing - rather than a card per category; the category and level
   survive as Labels on each row, and as the row ORDER, which PRACTICE_CATEGORIES
   still drives.

   The three glyphs are inline here rather than shared with shell.js's ICON, because
   the hub deliberately does not load shell.js (that file injects the simulator's
   whole markup). Three small SVGs is the cheaper duplication.

   They are the artwork of combinational.svg / sequential.svg / megacell.svg at the
   repo root, flattened to one line each and with the same two corrections those
   assets carry: the export's opaque full-canvas <rect fill="white"> is gone, and
   black became currentColor. Both matter here - a white backing would be a white box
   in dark mode, and .gh-row:hover changes the row's background underneath. The gate's
   own white body fill is gone too, which is why the combinational pin bars are
   trimmed to end under its outline stroke rather than running through it. */
var GLYPHS = {
  comb: '<svg class="gh-row-icon" viewBox="0 0 45 40" fill="currentColor"><rect x="5" y="10" width="6" height="5"/><rect x="5" y="25" width="6" height="5"/><rect x="36" y="17.5" width="6.5" height="5"/><path d="M 10 7.5 L 23.75 7.5 C 23.75 7.5 37.5 7.5 37.5 20 C 37.5 32.5 23.75 32.5 23.75 32.5 L 10 32.5 Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/></svg>',
  seq: '<svg class="gh-row-icon" viewBox="0 0 45 40" fill="currentColor"><rect x="7.5" y="5" width="25" height="5"/><rect x="12.5" y="30" width="20" height="5"/><rect x="7.5" y="5" width="5" height="30"/><rect x="32.5" y="5" width="5" height="30"/><path d="M 21.338835 20 L 19.571068 21.767767 L 10 12.196699 L 11.767767 10.428932 Z"/><path d="M 19.571068 18.232233 L 21.338835 20 L 11.767767 29.571068 L 10 27.8033 Z"/></svg>',
  mega: '<svg class="gh-row-icon" viewBox="0 0 45 40" fill="currentColor"><rect x="7.5" y="5" width="25" height="5"/><rect x="12.5" y="30" width="20" height="5"/><rect x="7.5" y="5" width="5" height="30"/><rect x="32.5" y="5" width="5" height="30"/><rect x="2.5" y="7.5" width="7.5" height="3.5714286"/><rect x="2.5" y="14.642857" width="7.5" height="3.5714286"/><rect x="2.5" y="21.785714" width="7.5" height="3.5714286"/><rect x="2.5" y="28.92857" width="7.5" height="3.5714286"/><rect x="35" y="7.5" width="7.5" height="3.5714286"/><rect x="35" y="14.642857" width="7.5" height="3.5714286"/><rect x="35" y="21.785714" width="7.5" height="3.5714286"/><rect x="35" y="28.92857" width="7.5" height="3.5714286"/></svg>'
};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
}

(function () {
  /* Sort by the declared category order, then by level, then as listed - so the
     grouping the category cards used to show survives as the row order. A category
     the order list forgot still appears, at the end, rather than dropping its rows. */
  var order = (window.PRACTICE_CATEGORIES || []).slice();
  PRACTICE_MANIFEST.forEach(function (e) {
    if (order.indexOf(e.category) < 0) order.push(e.category);
  });
  var rows = PRACTICE_MANIFEST.slice().sort(function (a, b) {
    var d = order.indexOf(a.category) - order.indexOf(b.category);
    if (d) return d;
    return (a.level || 0) - (b.level || 0);
  });
  var levels = [];
  rows.forEach(function (e) {
    if (levels.indexOf(String(e.level)) < 0) levels.push(String(e.level));
  });
  levels.sort();

  /* The filter. An EMPTY set means "no constraint from this row", not "match
     nothing" - so the load state is both sets empty and all twenty rows, and
     unpressing the last chip in a row restores it rather than emptying the page.
     Chips within a row are OR'd and the two rows are AND'd, which is what makes
     "Level 2" mean a level and not a fourth category. */
  var selCat = Object.create(null), selLevel = Object.create(null);
  var nSel = function (s) { return Object.keys(s).length; };
  var matches = function (e) {
    return (!nSel(selCat) || selCat[e.category])
        && (!nSel(selLevel) || selLevel[String(e.level)]);
  };

  var box = document.getElementById('hubBox');

  /* The chips are real elements rather than part of the innerHTML string below,
     because the stub DOM the harness uses does not parse injected markup - a chip
     inside a string has no element to click, and the whole filter would be
     untestable headlessly. Same reason the exercise sheet is built this way. */
  var head = document.createElement('div');
  head.className = 'gh-box-header';
  var countEl = document.createElement('span');
  countEl.className = 'gh-count';
  countEl.id = 'hubCount';

  function chipRow(label, values, sel, extraClass, id) {
    var lab = document.createElement('span');
    lab.className = 'gh-filter-label';
    lab.textContent = label;
    head.appendChild(lab);
    var wrap = document.createElement('div');
    wrap.className = 'gh-chips';
    wrap.id = id;
    values.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'gh-chip' + (extraClass ? ' ' + extraClass : '');
      b.textContent = extraClass === 'level' ? 'Level ' + v : v;
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('data-value', v);
      b.addEventListener('click', function () {
        if (sel[v]) delete sel[v]; else sel[v] = true;
        render();
      });
      wrap.appendChild(b);
    });
    head.appendChild(wrap);
    return wrap;
  }

  var catWrap = chipRow('Category :', order, selCat, '', 'hubCatChips');
  var lvlWrap = chipRow('Level :', levels, selLevel, 'level', 'hubLevelChips');
  head.appendChild(countEl);
  box.appendChild(head);

  var rowsEl = document.createElement('div');
  rowsEl.id = 'hubRows';
  box.appendChild(rowsEl);

  /* Reachable, not hypothetical: level is decided by category in this manifest,
     so 9 of the 15 category/level pairs match nothing and "Basics + Level 2" is
     one click away. Clear lives here rather than as a permanent control, and it
     has to be an element for the same reason the chips do. */
  var emptyEl = document.createElement('div');
  emptyEl.className = 'gh-row gh-empty';
  emptyEl.id = 'hubEmpty';
  var emptyMsg = document.createElement('span');
  emptyMsg.textContent = 'No problems match these filters.';
  var clearBtn = document.createElement('button');
  clearBtn.type = 'button';
  clearBtn.className = 'gh-clear';
  clearBtn.id = 'hubClear';
  clearBtn.textContent = 'Clear';
  clearBtn.addEventListener('click', function () {
    Object.keys(selCat).forEach(function (k) { delete selCat[k]; });
    Object.keys(selLevel).forEach(function (k) { delete selLevel[k]; });
    render();
  });
  emptyEl.appendChild(emptyMsg);
  emptyEl.appendChild(clearBtn);
  box.appendChild(emptyEl);

  function paintChips(wrap, sel) {
    for (var i = 0; i < wrap.children.length; i++) {
      var b = wrap.children[i], on = !!sel[b.getAttribute('data-value')];
      // aria-pressed and the class are two encodings of one bit, so they are
      // written together here and the harness asserts they never disagree.
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.classList[on ? 'add' : 'remove']('on');
    }
  }

  /* A row's progress, from whatever cloud.js has locally - which is the local
     record when signed out and the merged one after a pull, so the hub reads the
     same way in both cases and needs to know about neither.
   *
   * Deliberately its OWN class rather than a third `gh-label`: the two Labels are
   * what the Category and Level chips filter on, and Baerilog/test.py counts
   * `class="gh-label"` exactly to assert there are two per row. A badge wearing
   * that class would inflate the count and read as a third filterable facet,
   * which it is not.
   *
   * Absent for an exercise never run, rather than a grey "not started" on all
   * twenty: the hub's job is to show where you got to, and twenty badges saying
   * nothing happened is the empty state written out longhand. */
  function progressBadge(slug) {
    if (!window.CLOUD || !window.CLOUD.configured()) return '';
    var rec = window.CLOUD.load('practice', slug);
    if (!rec) return '';
    var v = rec.verdict;
    /* Edited but never run is worth saying: it is the state a learner leaves a
       page in mid-answer, and it is what makes the hub a place to resume from. */
    if (!v || !v.state || v.state === 'none') return '<span class="gh-prog">in progress</span>';
    if (v.state === 'pass') return '<span class="gh-prog pass">' + v.pass + '/' + v.pass + ' passing</span>';
    return '<span class="gh-prog fail">' + v.fail + ' failing</span>';
  }

  function render() {
    var shown = rows.filter(matches);
    var html = '';
    shown.forEach(function (e) {
      html += '<div class="gh-row">'
           + (GLYPHS[e.kind] || GLYPHS.comb)
           + '<a href="' + esc(e.slug) + '.html">' + esc(e.title) + '</a>'
           + '<span class="gh-slug">' + esc(e.slug) + '</span>'
           + '<span class="gh-blurb">' + esc(e.blurb || '') + '</span>'
           + '<span class="gh-labels">'
           +   progressBadge(e.slug)
           +   '<span class="gh-label">' + esc(e.category) + '</span>'
           +   '<span class="gh-label level">Level ' + esc(e.level) + '</span>'
           + '</span>'
           + '</div>';
    });
    rowsEl.innerHTML = html;
    /* "7 problems" while thirteen are hidden describes a catalogue that does not
       exist, so a filtered count always says what it is out of. Unfiltered wording
       is left exactly as it was. */
    countEl.textContent = shown.length === rows.length
      ? rows.length + ' problems'
      : shown.length + ' of ' + rows.length + ' problems';
    emptyEl.style.display = shown.length ? 'none' : '';
    paintChips(catWrap, selCat);
    paintChips(lvlWrap, selLevel);
  }

  render();

  /* Signing in, adopting a conflict, or a pull finishing all change what
     progressBadge would return, so the listing re-renders whenever cloud.js
     reports a change. Twenty rows of innerHTML is cheap, and it is the only way
     the hub can reflect work done on another machine without a manual reload.
     render() emits nothing itself, so this cannot loop. */
  if (window.CLOUD && window.CLOUD.configured()) {
    window.CLOUD.subscribe(function () { render(); });
    if (window.CLOUD.signedIn()) window.CLOUD.pull('practice').then(render);
  }
})();

/* >>> NAV MENU (canonical copy in tools/navmenu.js - do not edit in place) */
(function () {
  var inner = document.querySelector('.gh-header-inner');
  if (!inner || document.getElementById('navMenuBtn')) return;   // no bar, or already built

  /* The rows, in order. Bare filenames because these pages are siblings; Home is the
     one link that leaves the site. The three apps outside this directory (emulator,
     verify, workbench) are deliberately absent: they live one level ABOVE the deployed
     root, so a `../` row would resolve in the repo and 404 on the site. */
  var ITEMS = [
    ['Home', 'https://jeremyjbae.github.io/Baerilog', 'home'],
    ['Practice', 'index.html', 'book'],
    ['Simulator', 'simulator.html', 'pulse'],
    ['Synthesizer', 'synthesis.html', 'chip'],
    ['Compiler', 'compiler.html', 'code']
  ];
  var G = {
    menu: '<svg viewBox="0 0 16 16"><path d="M1.5 3.25h13v1.5h-13v-1.5Zm0 4h13v1.5h-13v-1.5Zm0 4h13v1.5h-13v-1.5Z"/></svg>',
    home: '<svg viewBox="0 0 16 16"><path d="M8 1.2 15 7l-.94 1.15-1.06-.88V14a1 1 0 0 1-1 1H9.5v-4.5h-3V15H4a1 1 0 0 1-1-1V7.27l-1.06.88L1 7 8 1.2Zm4 4.83L8 2.7 4 6.03V13.5h1V9h6v4.5h1V6.03Z"/></svg>',
    book: '<svg viewBox="0 0 16 16"><path d="M2 2.5A1.5 1.5 0 0 1 3.5 1H13a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a2 2 0 0 0-2 2V2.5Zm2.5-.5a.5.5 0 0 0-.5.5v10.1c.3-.07.63-.1.5-.1h8V2H4.5Z"/></svg>',
    pulse: '<svg viewBox="0 0 16 16"><path d="M6 2.5a.75.75 0 0 1 .7.48L9.3 10l1-2.5a.75.75 0 0 1 .7-.5h4v1.5h-3.5l-1.8 4.5a.75.75 0 0 1-1.4 0L5.7 5.5 4.7 8a.75.75 0 0 1-.7.5H0V7h3.5l1.8-4.02A.75.75 0 0 1 6 2.5Z"/></svg>',
    chip: '<svg viewBox="0 0 16 16"><path d="M5 1.5h1.5v1.5h3V1.5H11v1.5h1.5A1.5 1.5 0 0 1 14 4.5V6h1.5v1.5H14v1H15.5V10H14v1.5a1.5 1.5 0 0 1-1.5 1.5H11v1.5H9.5V13h-3v1.5H5V13H3.5A1.5 1.5 0 0 1 2 11.5V10H.5V8.5H2v-1H.5V6H2V4.5A1.5 1.5 0 0 1 3.5 3H5V1.5Zm-1.5 3v7h9v-7h-9Zm2 2h5v3h-5v-3Z"/></svg>',
    code: '<svg viewBox="0 0 16 16"><path d="M5.7 4.3a.75.75 0 0 1 0 1.06L3.06 8l2.64 2.64a.75.75 0 1 1-1.06 1.06L1.47 8.53a.75.75 0 0 1 0-1.06L4.64 4.3a.75.75 0 0 1 1.06 0Zm4.6 0a.75.75 0 0 1 1.06 0l3.17 3.17a.75.75 0 0 1 0 1.06L11.36 11.7a.75.75 0 1 1-1.06-1.06L12.94 8l-2.64-2.64a.75.75 0 0 1 0-1.06Z"/></svg>'
  };

  function mk(tag, cls, id, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (id) e.id = id;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  /* THREE OF THE SIX APPS LIVE OUTSIDE Baerilog/ - emulator, verify and workbench - so
     a bare filename does not resolve from them and this has to prefix. They are also
     the three that are NOT in the menu, and each carried a single `&larr; Baerilog` link
     back to the hub; the shared block hides `.gh-nav a`, so that link is gone and the
     drawer's Practice row is what replaces it. Getting this wrong is not cosmetic: it
     would leave those three with no way back at all. */
  var OUTSIDE = ['emulator', 'verify', 'workbench'];
  function base() {
    var parts = (window.location && window.location.pathname || '').split('/');
    var dir = parts[parts.length - 2] || '';
    return OUTSIDE.indexOf(dir) >= 0 ? '../Baerilog/' : '';
  }

  /* Which row is current, from the page's own URL rather than a per-app variable: one
     fewer thing for a copy to set wrong. A practice EXERCISE page is not index.html but
     is still Practice, which is why the marker falls back to it inside this directory -
     and why it marks NOTHING from the three outside it, none of which is a row. */
  function currentHref() {
    if (base()) return '';
    var file = (window.location && window.location.pathname || '').split('/').pop() || '';
    var known = ['simulator.html', 'synthesis.html', 'compiler.html'];
    return known.indexOf(file) >= 0 ? file : 'index.html';
  }

  var btn = mk('button', 'gh-menu-btn', 'navMenuBtn');
  btn.setAttribute('type', 'button');
  btn.setAttribute('aria-label', 'Open menu');
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', 'navDrawer');
  btn.setAttribute('title', 'Menu');
  btn.innerHTML = G.menu;
  inner.insertBefore(btn, inner.firstChild);

  var back = mk('div', 'nav-backdrop', 'navBackdrop');
  var panel = mk('aside', 'nav-drawer', 'navDrawer');
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('aria-label', 'Site menu');

  var head = mk('div', 'nav-drawer-head');
  /* The wordmark is CLONED out of the header rather than pasted in as another copy of
     those three paths: tools/logo.py rewrites every copy in the repo after a re-export,
     and one it does not know about goes stale silently. Two simple selectors, not the
     compound `.gh-mark svg`, because the stub DOM the harnesses use resolves one at a
     time and the compound form returns null - the drawer would ship with no logo while
     every test passed. On this light surface it drops the header's unconditional
     invert (style.css does that) or it renders white on white. */
  var wrap = document.querySelector('.gh-mark');
  var src = wrap && wrap.querySelector('svg');
  var mark = mk('span', 'nav-drawer-mark');
  if (src && src.cloneNode) mark.appendChild(src.cloneNode(true));
  head.appendChild(mark);
  var close = mk('button', 'ex-close nav-drawer-close', 'navCloseBtn', '✕');
  close.setAttribute('type', 'button');
  close.setAttribute('title', 'Close');
  close.setAttribute('aria-label', 'Close menu');
  head.appendChild(close);
  panel.appendChild(head);

  var list = mk('nav', 'nav-drawer-list', 'navDrawerList');
  var here = currentHref();
  var pre = base();
  for (var i = 0; i < ITEMS.length; i++) {
    var row = mk('a', 'nav-row' + (ITEMS[i][1] === here ? ' current' : ''));
    // the off-site row is absolute and must not be prefixed
    row.setAttribute('href', /^https?:/.test(ITEMS[i][1]) ? ITEMS[i][1] : pre + ITEMS[i][1]);
    var ic = mk('span', null, 'nav-row-icon');
    ic.className = 'nav-row-icon';
    ic.innerHTML = G[ITEMS[i][2]] || '';
    row.appendChild(ic);
    row.appendChild(mk('span', 'nav-row-label', null, ITEMS[i][0]));
    list.appendChild(row);
  }
  panel.appendChild(list);
  /* The panel is a CHILD of the backdrop, as every dialog here is: that is what makes
     the ev.target guard below load-bearing rather than unfalsifiable - as siblings, a
     click inside the panel could never reach the backdrop's handler. */
  back.appendChild(panel);
  document.body.appendChild(back);

  function isOpen() { return panel.classList.contains('open'); }
  function open() {
    /* One drawer at a time: cloud-ui.js's account drawer comes in from the right and is
       looked up at click time, so neither depends on loading before the other. */
    var ab = document.getElementById('cloudDrawerBack');
    var ap = document.getElementById('cloudDrawer');
    if (ab) ab.classList.remove('open');
    if (ap) ap.classList.remove('open');
    panel.classList.add('open');
    back.classList.add('open');
    document.body.classList.add('nav-open');
    btn.setAttribute('aria-expanded', 'true');
    var first = list.children[0];
    if (first && first.focus) first.focus();
  }
  function shut() {
    panel.classList.remove('open');
    back.classList.remove('open');
    document.body.classList.remove('nav-open');
    btn.setAttribute('aria-expanded', 'false');
    if (btn.focus) btn.focus();
  }
  btn.addEventListener('click', function () { if (isOpen()) shut(); else open(); });
  close.addEventListener('click', shut);
  back.addEventListener('click', function (ev) { if (ev.target === back) shut(); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && isOpen()) shut();
  });
})();
/* <<< NAV MENU */

</script>
</body>
</html>
