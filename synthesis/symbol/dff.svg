<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xl="http://www.w3.org/1999/xlink" viewBox="0 0 90 90" width="90" height="90">
  <!--
    dff (D flip-flop) template — same convention as the other files in this folder:
    edit the body/stub/bubble geometry freely, but keep the four small red <circle> "pin
    markers" at (or move them to) the coordinates where a wire should connect. The app
    reads these circles' (cx, cy) against this viewBox to position React Flow's handles.
    The red circles themselves are never drawn in the app — they're authoring-only markers.

    Pin roles (matching the dff primitive's port list d / rstn / clk -> q):
      d    : (0, 30)  - data input, upper-left
      rstn : (0, 60)  - async active-low reset, lower-left (drawn with an inversion
                         bubble at the box edge, same convention as nand/nor/xnor)
      clk  : (40, 90) - clock input, bottom edge (drawn with a small triangle notch
                         just inside the box, the standard edge-triggered-clock marker)
      q    : (90, 30) - output, right edge
  -->
  <defs/>
  <g id="dff" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-dasharray="none" fill="none">
    <title>dff</title>
    <rect fill="white" x="0" y="0" width="90" height="90"/>
    <g id="dff_Layer_1">
      <title>Layer 1</title>

      <!-- wire stubs -->
      <g id="Line_d">
        <line x1="0" y1="30" x2="24" y2="30" stroke="#5856d6" stroke-linecap="butt" stroke-linejoin="round" stroke-width="3"/>
      </g>
      <g id="Line_rstn">
        <line x1="0" y1="60" x2="16" y2="60" stroke="#5856d6" stroke-linecap="butt" stroke-linejoin="round" stroke-width="3"/>
      </g>
      <g id="Line_clk">
        <line x1="40" y1="80" x2="40" y2="90" stroke="#5856d6" stroke-linecap="butt" stroke-linejoin="round" stroke-width="3"/>
      </g>
      <g id="Line_q">
        <line x1="70" y1="30" x2="90" y2="30" stroke="#5856d6" stroke-linecap="butt" stroke-linejoin="round" stroke-width="3"/>
      </g>

      <!-- pin markers: position metadata only, not drawn by the app -->
      <g id="Graphic_pin_d">
        <circle cx="0" cy="30" r="3" fill="red"/>
      </g>
      <g id="Graphic_pin_rstn">
        <circle cx="0" cy="60" r="3" fill="red"/>
      </g>
      <g id="Graphic_pin_clk">
        <circle cx="40" cy="90" r="3" fill="red"/>
      </g>
      <g id="Graphic_pin_q">
        <circle cx="90" cy="30" r="3" fill="red"/>
      </g>

      <!-- body: plain rectangle, the standard box symbol for a register/flip-flop -->
      <g id="Graphic_body">
        <path d="M 24 10 L 70 10 L 70 80 L 24 80 Z" fill="white"/>
        <path d="M 24 10 L 70 10 L 70 80 L 24 80 Z" stroke="#5856d6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      </g>

      <!-- inversion bubble on rstn (active-low reset), same convention as nand/nor/xnor -->
      <g id="Graphic_rstn_bubble">
        <circle cx="20" cy="60" r="4" fill="white" stroke="#5856d6" stroke-linecap="butt" stroke-linejoin="round" stroke-width="3"/>
      </g>

      <!-- clock triangle notch, the standard edge-triggered-clock marker -->
      <g id="Graphic_clk_notch">
        <path d="M 34 80 L 40 70 L 46 80 Z" fill="white" stroke="#5856d6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      </g>

      <!-- optional label; delete if you'd rather the shape stand on its own like the gate symbols -->
      <text x="47" y="49" font-family="Helvetica" font-size="15" font-weight="bold" fill="#5856d6" text-anchor="middle">DFF</text>
    </g>
  </g>
</svg>
