<!-- Load order is load-bearing: shell.js injects the markup app.js's UI wiring
     needs, and practice.js runs after app.js has defined everything. -->
<script>var PRACTICE_SLUG = 'edge-detector';</script>
<script src="manifest.js"></script>
<script src="exercises/edge-detector.js"></script>
<!-- These two ahead of shell.js, and the rest of the cloud layer at the end. shell.js
     decides whether the exercise sheet is built OPEN - a page you have begun does not
     get the brief unasked - and it reads that off CLOUD.load, so the record has to be
     readable before the markup is built. Closing the sheet later instead would be a
     FLASH of a full-page modal rather than an absence of one: app.js is a quarter of a
     megabyte of blocking script between here and practice.js, and a browser paints
     during that fetch. Safe to hoist because neither file touches the DOM or depends on
     anything; cloud-ui.js and cloud-sync.js cannot move, needing the injected header
     and the seeded editor respectively. -->
<script src="cloud-config.js"></script>
<script src="cloud.js"></script>
<script src="shell.js"></script>
<script src="app.js"></script>
<!-- The shared flow-strip builder, before the file that drives it. code2silicon.html loads the
     same file: the row is one builder, not a copy per page kind. -->

<script src="practice.js"></script>
<script src="synth.js"></script>
<script src="practice-synth.js"></script>
<!-- The rest of the optional cloud progress, last so cloud-sync.js sees the
     skeleton practice.js seeded and restores saved work OVER it rather than under it.
     Every one of the four is inert until cloud-config.js names a Supabase project, so a
     checkout with none behaves exactly as it did before they existed. No CLOUD_APP
     declaration here: PRACTICE_SLUG above already says which app and which of the
     twenty documents this page is. -->
